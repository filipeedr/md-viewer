<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MlookD — Free Online Markdown (.md) Viewer</title>
    <meta
      name="description"
      content="MlookD is a free online Markdown (.md) viewer. Drop or open a .md file to preview it instantly — headings, tables, code blocks, links, images — right in your browser. No upload, no install, no sign-up."
    />
    <link rel="canonical" href="https://mlookd.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MlookD" />
    <meta property="og:title" content="MlookD — Free Online Markdown (.md) Viewer" />
    <meta
      property="og:description"
      content="Free online Markdown (.md) viewer. Drop a file and preview it instantly — tables, code blocks, images. No upload, no install, no sign-up."
    />
    <meta property="og:url" content="https://mlookd.com/" />
    <meta property="og:image" content="https://mlookd.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MlookD — Free Online Markdown (.md) Viewer" />
    <meta
      name="twitter:description"
      content="Free online Markdown (.md) viewer. Drop a file and preview it instantly. No upload, no install, no sign-up."
    />
    <meta name="twitter:image" content="https://mlookd.com/og-image.png" />

    <!-- Structured data: describes the app for search engines and AI assistants -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MlookD",
        "alternateName": "MD Viewer",
        "url": "https://mlookd.com/",
        "description": "MlookD is a free, client-side Markdown (.md) viewer. Files are rendered in the browser and never uploaded.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with JavaScript enabled",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "GitHub-flavored Markdown rendering",
          "Drag-and-drop or file picker upload",
          "Local-only processing, no server upload",
          "Dark mode",
          "Chapter sidebar with scroll-spy table of contents",
          "One-click code block copying"
        ],
        "isAccessibleForFree": true,
        "sameAs": ["https://github.com/filipeedr/md-viewer"]
      }
    </script>

    <!-- Resolves the theme (stored override, else system preference) and
         stamps it on <html> before any stylesheet loads, so the first paint
         is already in the right theme. -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem("md-viewer:theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <script>
      (function (document, window) {
        var token = "%VITE_POSTHOG_PROJECT_TOKEN%";
        if (!token.startsWith("phc_")) return;

        var configuredHost = "%VITE_POSTHOG_HOST%";
        var apiHost = configuredHost.startsWith("https://")
          ? configuredHost
          : "https://us.i.posthog.com";
        var posthog = window.posthog || [];

        if (posthog.__SV || posthog.__loaded) return;
        window.posthog = posthog;
        posthog._i = [];
        posthog.init = function (projectToken, options, instanceName) {
          var script = document.createElement("script");
          script.type = "text/javascript";
          script.crossOrigin = "anonymous";
          script.async = true;
          script.src = options.api_host.replace(".i.posthog.com", "-assets.i.posthog.com") + "/static/array.js";
          script.onerror = function () {
            script.remove();
          };
          var firstScript = document.getElementsByTagName("script")[0];
          firstScript.parentNode.insertBefore(script, firstScript);

          var instance = posthog;
          if (instanceName) instance = (posthog[instanceName] = []);
          instance.people = instance.people || [];
          instance.person = instance.person || [];
          var methods = "capture identify alias people.set people.set_once people.unset people.increment people.append people.remove people.clear_charges people.set_charges person.set person.set_once person.unset person.increment person.append person.remove group setPersonProperties setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags resetGroups get_distinct_id getGroups get_session_id get_session_replay_url startSessionRecording stopSessionRecording sessionRecordingStarted opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing".split(" ");
          methods.forEach(function (method) {
            var parts = method.split(".");
            var target = parts.length === 2 ? instance[parts[0]] : instance;
            var name = parts.length === 2 ? parts[1] : method;
            target[name] = function () {
              target.push([name].concat(Array.prototype.slice.call(arguments)));
            };
          });
          posthog._i.push([projectToken, options, instanceName]);
          posthog.__SV = 1;
        };

        posthog.init(token, {
          api_host: apiHost,
          defaults: "2026-05-30",
          autocapture: false,
          capture_pageview: true,
          capture_pageleave: true,
          disable_session_recording: true,
        });
      })(document, window);
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static fallback content: mirrors the initial React render, so
           crawlers/bots that don't execute JavaScript still see real markup
           instead of an empty div. React replaces this on mount. -->
      <div class="empty-state">
        <div class="empty-state__main">
          <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 5v14M5 12h14"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <h1 class="visually-hidden">MlookD — free online Markdown (.md) viewer</h1>
          <p class="empty-state__hint">Just drop or choose your .md file</p>
        </div>
        <div class="empty-state__footer">
          <p>
            Your Markdown file stays on your device and is never uploaded.
          </p>
          <p class="visually-hidden">
            Renders GitHub-flavored Markdown — headings, tables, code blocks, links, and images.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
