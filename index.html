<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MD Viewer — Free Online Markdown (.md) File Viewer</title>
    <meta
      name="description"
      content="Preview any Markdown (.md) file instantly in your browser. Drop or choose a file to render GitHub-flavored Markdown — headings, tables, code blocks, links, images — with dark mode and a chapter sidebar. Nothing is uploaded, saved, or tracked."
    />
    <link rel="canonical" href="https://mlookd.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MD Viewer" />
    <meta property="og:title" content="MD Viewer — Free Online Markdown (.md) File Viewer" />
    <meta
      property="og:description"
      content="Preview any Markdown (.md) file instantly in your browser. Nothing is uploaded, saved, or tracked — everything renders locally on your machine."
    />
    <meta property="og:url" content="https://mlookd.com/" />
    <meta property="og:image" content="https://mlookd.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MD Viewer — Free Online Markdown (.md) File Viewer" />
    <meta
      name="twitter:description"
      content="Preview any Markdown (.md) file instantly in your browser. Nothing is uploaded, saved, or tracked."
    />
    <meta name="twitter:image" content="https://mlookd.com/og-image.png" />

    <!-- Structured data: describes the app for search engines and AI assistants -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MD Viewer",
        "url": "https://mlookd.com/",
        "description": "A free, client-only Markdown (.md) file viewer. Drop or choose a file to render it fully formatted in the browser, with dark mode and a chapter sidebar. Nothing is uploaded, saved, or cached — refreshing always returns to a blank slate.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with JavaScript enabled",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "GitHub-flavored Markdown rendering",
          "Drag-and-drop or file picker upload",
          "Local-only processing, no server upload",
          "Dark mode",
          "Chapter sidebar with scroll-spy table of contents",
          "One-click code block copying"
        ],
        "isAccessibleForFree": true,
        "sameAs": ["https://github.com/filipeedr/md-viewer"]
      }
    </script>

    <!-- Resolves the theme (stored override, else system preference) and
         stamps it on <html> before any stylesheet loads, so the first paint
         is already in the right theme. -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem("md-viewer:theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static fallback content: mirrors the initial React render, so
           crawlers/bots that don't execute JavaScript still see real markup
           instead of an empty div. React replaces this on mount. -->
      <div class="empty-state">
        <div class="empty-state__main">
          <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 5v14M5 12h14"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <h1 class="empty-state__title">MD Viewer</h1>
          <p class="empty-state__hint">
            Drop or choose your .md file to preview it instantly, fully formatted.
          </p>
        </div>
        <div class="empty-state__footer">
          <p>
            Renders GitHub-flavored Markdown — headings, tables, code blocks, links, and images —
            entirely in your browser. The file is processed on the local machine only; nothing is
            sent to servers or stored in a database.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
